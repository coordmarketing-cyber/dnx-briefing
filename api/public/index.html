<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DNX — !briefing</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:opsz,wght@9..40,400;9..40,500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0d0d0d;--s:#161616;--s2:#1f1f1f;--s3:#282828;
  --b:#2a2a2a;--b2:#383838;
  --t:#f0ede8;--t2:#a09a94;--t3:#5a5550;
  --ac:#c8b89a;--red:#e05555;--or:#d4843a;
  --ye:#c9a840;--gr:#5a9966;--bl:#4d87c4;--te:#3d9488;--pk:#b85c8a;--pu:#9b7fd4;
  --r:8px;--rl:12px;
}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--t);min-height:100vh;font-size:14px;line-height:1.5}
::-webkit-scrollbar{width:3px}::-webkit-scrollbar-thumb{background:var(--b2);border-radius:2px}
.app{display:flex;min-height:100vh}
.sb{width:200px;flex-shrink:0;background:var(--s);border-right:1px solid var(--b);display:flex;flex-direction:column;position:fixed;top:0;left:0;bottom:0;z-index:100}
.sb-logo{padding:16px 16px 12px;border-bottom:1px solid var(--b)}
.sb-logo h1{font-family:'Syne',sans-serif;font-weight:800;font-size:19px;letter-spacing:-0.03em}
.sb-logo p{font-size:9px;color:var(--t3);letter-spacing:0.12em;text-transform:uppercase;margin-top:1px}
.sb-nav{flex:1;padding:8px 0;overflow-y:auto}
.sb-sec{padding:7px 14px 2px;font-size:9px;letter-spacing:0.1em;text-transform:uppercase;color:var(--t3)}
.ni{display:flex;align-items:center;gap:8px;padding:7px 14px;cursor:pointer;color:var(--t2);font-size:12px;transition:all 0.1s;border-left:2px solid transparent;user-select:none}
.ni:hover{color:var(--t);background:var(--s2)}
.ni.on{color:var(--ac);border-left-color:var(--ac);background:rgba(200,184,154,0.07)}
.dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.sb-bot{padding:10px 12px;border-top:1px solid var(--b)}
.sb-stat{font-size:10px;color:var(--gr);margin-bottom:6px;display:flex;align-items:center;gap:4px}
.sb-stat::before{content:'';width:5px;height:5px;border-radius:50%;background:var(--gr);flex-shrink:0}
.lbl{font-size:9px;color:var(--t3);letter-spacing:0.06em;margin-bottom:4px}
.ainput{width:100%;background:var(--s2);border:1px solid var(--b2);border-radius:var(--r);padding:6px 9px;color:var(--t);font-size:11px;font-family:inherit;outline:none}
.ainput:focus{border-color:var(--ac)}
.main{margin-left:200px;flex:1;display:flex;flex-direction:column;min-height:100vh}
.topbar{position:sticky;top:0;background:rgba(13,13,13,0.95);backdrop-filter:blur(8px);border-bottom:1px solid var(--b);padding:9px 22px;display:flex;align-items:center;justify-content:space-between;z-index:50}
.tt{font-family:'Syne',sans-serif;font-size:12px;font-weight:700;letter-spacing:0.04em}
.tr{display:flex;align-items:center;gap:7px}
.tdate{font-size:10px;color:var(--t3);margin-right:4px}
.btn{display:inline-flex;align-items:center;gap:5px;padding:5px 12px;border-radius:var(--r);font-size:11px;font-family:inherit;font-weight:500;cursor:pointer;transition:all 0.1s;border:none;outline:none}
.bp{background:var(--ac);color:#1a1510}.bp:hover{background:#d4c4ab}.bp:disabled{opacity:0.4;cursor:not-allowed}
.bg{background:var(--s2);border:1px solid var(--b);color:var(--t2)}.bg:hover{color:var(--t);border-color:var(--b2)}
.con{padding:20px 22px;flex:1}
.sh{display:flex;align-items:center;gap:9px;margin-bottom:12px}
.st{font-family:'Syne',sans-serif;font-size:9px;font-weight:700;letter-spacing:0.14em;text-transform:uppercase;color:var(--t3);white-space:nowrap}
.sl{flex:1;height:1px;background:var(--b)}
.sc-count{font-size:10px;color:var(--t3);white-space:nowrap}
/* STATS */
.sg{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-bottom:18px}
.sc{background:var(--s);border:1px solid var(--b);border-top:2px solid var(--cc,var(--b));border-radius:var(--rl);padding:12px 14px}
.sl2{font-size:10px;color:var(--t3);margin-bottom:4px}
.sv{font-family:'Syne',sans-serif;font-size:26px;font-weight:700;line-height:1}
.ss{font-size:10px;color:var(--t3);margin-top:3px}
/* TWO COL */
.tc{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:18px}
.pan{background:var(--s);border:1px solid var(--b);border-radius:var(--rl);overflow:hidden}
.ph{display:flex;align-items:center;justify-content:space-between;padding:10px 13px;background:var(--s2);border-bottom:1px solid var(--b)}
.pt{font-family:'Syne',sans-serif;font-size:9px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;color:var(--t3)}
.pb{max-height:300px;overflow-y:auto}
/* ROWS */
.row{display:flex;align-items:flex-start;gap:8px;padding:8px 12px;border-bottom:1px solid rgba(42,42,42,0.4);transition:background 0.08s}
.row:last-child{border-bottom:none}
.row:hover{background:rgba(255,255,255,0.015)}
.rn{font-size:12px;color:var(--t);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;line-height:1.3}
.rm{font-size:10px;color:var(--t3);margin-top:2px}
.rtags{display:flex;gap:3px;flex-wrap:wrap;flex-shrink:0;align-items:center}
/* TABLE */
.tw{background:var(--s);border:1px solid var(--b);border-radius:var(--rl);overflow:hidden;margin-bottom:18px}
table{width:100%;border-collapse:collapse}
th{text-align:left;padding:7px 12px;font-size:9px;letter-spacing:0.09em;text-transform:uppercase;color:var(--t3);border-bottom:1px solid var(--b);font-weight:500;background:var(--s2)}
td{padding:8px 12px;border-bottom:1px solid rgba(42,42,42,0.4);font-size:12px;vertical-align:middle}
tr:last-child td{border-bottom:none}
tr:hover td{background:rgba(255,255,255,0.012)}
/* DATA URGENCY HIGHLIGHT */
.row-today{background:rgba(212,132,58,0.06)!important}
.row-today:hover{background:rgba(212,132,58,0.1)!important}
.row-overdue{background:rgba(224,85,85,0.05)!important}
tr.row-today td{background:rgba(212,132,58,0.06)}
tr.row-today:hover td{background:rgba(212,132,58,0.1)}
tr.row-overdue td{background:rgba(224,85,85,0.04)}
/* DATE PILL */
.date-pill{display:inline-flex;align-items:center;font-size:10px;font-weight:600;padding:2px 7px;border-radius:10px;white-space:nowrap}
.dp-today{background:rgba(212,132,58,0.2);color:var(--or);border:1px solid rgba(212,132,58,0.3)}
.dp-tomorrow{background:rgba(201,168,64,0.15);color:var(--ye);border:1px solid rgba(201,168,64,0.25)}
.dp-soon{background:rgba(90,153,102,0.12);color:var(--gr);border:1px solid rgba(90,153,102,0.2)}
.dp-none{background:var(--s3);color:var(--t3);border:1px solid var(--b)}
.dp-overdue{background:rgba(224,85,85,0.15);color:var(--red);border:1px solid rgba(224,85,85,0.3)}
/* BADGE */
.badge{display:inline-flex;align-items:center;font-size:9px;font-weight:600;padding:2px 6px;border-radius:4px;white-space:nowrap}
.br{background:rgba(224,85,85,0.15);color:var(--red)}
.bo{background:rgba(212,132,58,0.18);color:var(--or)}
.by{background:rgba(201,168,64,0.14);color:var(--ye)}
.bgg{background:rgba(90,153,102,0.14);color:var(--gr)}
.bt{background:rgba(61,148,136,0.14);color:var(--te)}
.bb{background:rgba(77,135,196,0.14);color:var(--bl)}
.bpu{background:rgba(155,127,212,0.12);color:var(--pu)}
.bgr{background:var(--s3);color:var(--t3)}
/* FILTERS */
.frow{display:flex;gap:4px;margin-bottom:12px;flex-wrap:wrap;align-items:center}
.fb{padding:4px 10px;border-radius:var(--r);font-size:11px;cursor:pointer;border:1px solid var(--b);background:transparent;color:var(--t3);font-family:inherit;transition:all 0.1s}
.fb:hover{color:var(--t);border-color:var(--b2)}
.fb.on{background:var(--s2);border-color:var(--b2);color:var(--t)}
.filter-label{font-size:10px;color:var(--t3);margin-right:4px}
/* BOARDS GRID */
.bg2{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:18px}
.bc{background:var(--s);border:1px solid var(--b);border-radius:var(--rl);padding:12px;cursor:pointer;transition:all 0.1s}
.bc:hover{border-color:var(--b2);background:var(--s2)}
.bcn{font-family:'Syne',sans-serif;font-size:11px;font-weight:700;color:var(--t);margin-bottom:8px;display:flex;align-items:center;gap:6px;line-height:1.3}
.bcs{display:flex;gap:8px;flex-wrap:wrap}
.bci{font-size:10px;color:var(--t3)}
.bci b{color:var(--t);font-weight:500;margin-left:2px}
/* SECTION SEPARATOR */
.date-sep{padding:5px 12px;font-size:10px;font-weight:600;color:var(--t3);background:var(--s2);border-bottom:1px solid var(--b);letter-spacing:0.06em;text-transform:uppercase;display:flex;align-items:center;gap:8px}
.date-sep::after{content:'';flex:1;height:1px;background:var(--b)}
/* BRIEFING */
.brw{max-width:740px}
.brk{background:var(--s);border:1px solid var(--b);border-radius:var(--rl);padding:12px 14px;margin-bottom:10px;display:flex;align-items:center;gap:10px}
.brbox{background:var(--s);border:1px solid var(--b);border-radius:var(--rl);overflow:hidden}
.brtop{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;background:var(--s2);border-bottom:1px solid var(--b)}
.brbody{padding:16px 18px;max-height:520px;overflow-y:auto;line-height:1.8}
.brbody h2{font-family:'Syne',sans-serif;font-size:13px;font-weight:700;color:var(--ac);margin:14px 0 6px;letter-spacing:0.04em}
.brbody h2:first-child{margin-top:0}
.brbody p{color:var(--t2);font-size:12px;margin-bottom:7px}
.brbody ul{list-style:none}
.brbody li{padding:2px 0 2px 12px;position:relative;color:var(--t2);font-size:12px}
.brbody li::before{content:'·';position:absolute;left:1px;color:var(--ac);font-weight:700}
.brbody strong{color:var(--t);font-weight:500}
.bm{background:rgba(201,168,64,0.15);color:var(--ye)}
.be2{background:rgba(77,135,196,0.15);color:var(--bl)}
.cur{display:inline-block;width:2px;height:13px;background:var(--ac);animation:blink 0.8s infinite;vertical-align:text-bottom;margin-left:1px}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0}}
.spin{width:12px;height:12px;border:2px solid rgba(200,184,154,0.2);border-top-color:var(--ac);border-radius:50%;animation:spin 0.7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.toast{position:fixed;bottom:16px;right:16px;background:var(--s2);border:1px solid var(--b2);border-radius:var(--r);padding:8px 14px;font-size:12px;z-index:999;opacity:0;transform:translateY(4px);transition:all 0.16s;pointer-events:none}
.toast.show{opacity:1;transform:translateY(0)}
.empty{text-align:center;padding:28px;color:var(--t3)}
.empty h3{font-family:'Syne',sans-serif;font-size:13px;color:var(--t2);margin-bottom:4px}
@media(max-width:800px){.sg{grid-template-columns:1fr 1fr}.tc{grid-template-columns:1fr}.bg2{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>

</aside>
<main class="main">

      <button class="btn bg" onclick="gen('evening')" id="be">Fechamento</button>
    </div>

</main>
</div>

const MCOL={"Desconexo":"br","Desco":"bo","DNX Hotelaria":"bb","Pablo Guterres":"bgr"};
const SCOL={"Em produção":"bb","Em revisão":"bpu","Aprovado":"bgg","Agendado":"by","Publicado":"bt","Ideia":"bgr"};

let V='dashboard',BF=null,NF=null,TF='active',NTF='date',LB='',GEN=false;

function today(){return new Date().toISOString().split('T')[0]}
function tomorrow(){const d=new Date();d.setDate(d.getDate()+1);return d.toISOString().split('T')[0]}
function fd(d){if(!d)return'—';const[y,m,dd]=d.split('-');return`${dd}/${m}`}

// Classifica prazo do Trello
function cls(due,done){
  if(!due)return'none';if(done)return'done';
  const t=today(),tm=tomorrow();
  if(due<t)return'overdue';if(due===t)return'today';if(due===tm)return'tomorrow';return'upcoming';
}

// Classifica urgência do Notion por data de publicação
function nurgency(due){
  if(!due)return'none';
  const t=today(),tm=tomorrow();
  if(due<t)return'overdue';
  if(due===t)return'today';
  if(due===tm)return'tomorrow';
  return'soon';
}

function datePill(due){
  const u=nurgency(due);
  if(u==='today')return`<span class="date-pill dp-today">Hoje ${fd(due)}</span>`;
  if(u==='tomorrow')return`<span class="date-pill dp-tomorrow">Amanhã ${fd(due)}</span>`;
  if(u==='soon')return`<span class="date-pill dp-soon">${fd(due)}</span>`;
  if(u==='overdue')return`<span class="date-pill dp-overdue">Vencido ${fd(due)}</span>`;
  return`<span class="date-pill dp-none">Sem data</span>`;
}

function dbadge(c){
  const m={overdue:['br','Vencido'],today:['bo','Hoje'],tomorrow:['by','Amanhã'],upcoming:['bgg','Próximo'],done:['bt','Feito'],none:['bgr','—']};
  const[k,l]=m[c]||m.none;return`<span class="badge ${k}">${l}</span>`;
}
function sbadge(s){return`<span class="badge ${SCOL[s]||'bgr'}">${s||'—'}</span>`}
function mbadge(m){return(m||'').split(',').map(x=>`<span class="badge ${MCOL[x.trim()]||'bgr'}" style="margin-right:2px">${x.trim()}</span>`).join('')}
function bc(n){return BCOL[n]||'var(--ac)'}
function sn(n){return n.replace('DNX HOTELARIA - ','').replace("GRUPO DNX | ",'').replace("JORNADA DE CAMPANHAS'26",'Jornada')}

function cards(){
  let out=[];
  for(const b of BOARDS){
    if(BF&&b.name!==BF)continue;
    for(const c of b.cards)out.push({...c,board:b.name,status:cls(c.due,c.dueComplete)});
  }
  return out;
}

// Notion filtrado e ORDENADO por urgência de data
function getSortedNotion(filter){
  let out=NOTION.filter(n=>n.status!=='Publicado');
  if(NF)out=out.filter(n=>n.marca===NF);
  if(filter==='today')out=out.filter(n=>nurgency(n.due)==='today'||nurgency(n.due)==='overdue');
  else if(filter==='soon')out=out.filter(n=>['today','tomorrow','soon'].includes(nurgency(n.due)));
  else if(filter==='ready')out=out.filter(n=>['Aprovado','Agendado'].includes(n.status));
  else if(filter==='prod')out=out.filter(n=>['Em produção','Em revisão'].includes(n.status));

  // Ordenar: overdue → today → tomorrow → soon (com data) → sem data
  const order={overdue:0,today:1,tomorrow:2,soon:3,none:4};
  return out.sort((a,b)=>{
    const ua=order[nurgency(a.due)]??4;
    const ub=order[nurgency(b.due)]??4;
    if(ua!==ub)return ua-ub;
    if(a.due&&b.due)return a.due.localeCompare(b.due);
    if(a.due&&!b.due)return-1;
    if(!a.due&&b.due)return 1;
    return 0;
  });
}

function stats(){
  let ov=0,td=0,tm=0,ac=0,np=0,na=0;
  for(const b of BOARDS)for(const c of b.cards){
    const s=cls(c.due,c.dueComplete);
    if(s==='overdue')ov++;if(s==='today')td++;if(s==='tomorrow')tm++;
    if(!['done','none'].includes(s))ac++;
  }
  for(const n of NOTION){
    if(['Em produção','Em revisão'].includes(n.status))np++;
    if(['Aprovado','Agendado'].includes(n.status))na++;
  }
  return{ov,td,tm,ac,np,na};
}

}

<div class="sg">
  <div class="sc" style="--cc:var(--red)"><div class="sl2">Trello vencidos</div><div class="sv" style="color:var(--red)">${st.ov}</div><div class="ss">Ação imediata</div></div>
  <div class="sc" style="--cc:var(--or)"><div class="sl2">Vencem hoje</div><div class="sv" style="color:var(--or)">${st.td}</div><div class="ss">${fd(today())}</div></div>
  <div class="sc" style="--cc:var(--ye)"><div class="sl2">Vencem amanhã</div><div class="sv" style="color:var(--ye)">${st.tm}</div></div>
  <div class="sc" style="--cc:var(--pu)"><div class="sl2">Notion produção</div><div class="sv" style="color:var(--pu)">${st.np}</div><div class="ss">Em produção/revisão</div></div>
  <div class="sc" style="--cc:var(--gr)"><div class="sl2">Notion aprovado</div><div class="sv" style="color:var(--gr)">${st.na}</div><div class="ss">Prontos p/ publicar</div></div>
</div>

<div class="tc">
  <div class="pan">
    <div class="ph"><div class="pt">Trello — urgente & vencido</div><a style="font-size:10px;color:var(--ac);cursor:pointer" onclick="V='trello';TF='overdue';render()">Ver todos →</a></div>
    <div class="pb">
      ${urgent.length?urgent.map(c=>`
        <div class="row ${c.status==='today'?'row-today':c.status==='overdue'?'row-overdue':''}">
          <span class="dot" style="background:${bc(c.board)};margin-top:4px;flex-shrink:0"></span>
          <div style="flex:1;min-width:0">
            <div class="rn">${c.url?`<a href="${c.url}" target="_blank" style="color:inherit;text-decoration:none">${c.name}</a>`:c.name}</div>
            <div class="rm">${sn(c.board)} · ${c.list}</div>
          </div>
          <div class="rtags">${dbadge(c.status)}<span style="font-size:9px;color:var(--t3);margin-left:3px">${fd(c.due)}</span></div>
        </div>`).join(''):'<div class="empty"><h3>Nada urgente</h3></div>'}
    </div>
  </div>
  <div class="pan">
    <div class="ph"><div class="pt" style="color:var(--pu)">Notion — publicação em ordem</div><a style="font-size:10px;color:var(--pu);cursor:pointer" onclick="nav('notion')">Ver todos →</a></div>
    <div class="pb">
      ${nSoon.length?nSoon.map(n=>`
        <div class="row">
          <div style="flex:1;min-width:0">
            <div class="rn">${n.url?`<a href="${n.url}" target="_blank" style="color:inherit;text-decoration:none">${n.name}</a>`:n.name}</div>
            <div class="rm">${n.canal}</div>
          </div>
          <div class="rtags">${datePill(n.due)}${sbadge(n.status)}</div>
        </div>`).join(''):'<div class="empty"><h3>Sem conteúdo agendado</h3></div>'}
    </div>
  </div>
</div>

<div class="sh"><div class="st">Boards Trello</div><div class="sl"></div></div>
<div class="bg2">
  ${BOARDS.map(b=>{
    const ov=b.cards.filter(c=>cls(c.due,c.dueComplete)==='overdue').length;
    const td=b.cards.filter(c=>cls(c.due,c.dueComplete)==='today').length;
    const ac=b.cards.filter(c=>!['done','none'].includes(cls(c.due,c.dueComplete))).length;
    return`<div class="bc" onclick="fBoard('${b.name.replace(/'/g,"\\'")}')">
      <div class="bcn"><span class="dot" style="background:${bc(b.name)}"></span>${sn(b.name)}</div>
      <div class="bcs">
        ${ov>0?`<div class="bci" style="color:var(--red)">⚠ ${ov} venc.</div>`:''}
        ${td>0?`<div class="bci">Hoje:<b>${td}</b></div>`:''}
        <div class="bci">Ativos:<b>${ac}</b></div>
      </div>
    </div>`;
  }).join('')}
</div>`;
}

// ── TRELLO ──
function rTrello(el){
  let cs=cards();
  if(TF==='overdue')cs=cs.filter(c=>c.status==='overdue');
  else if(TF==='today')cs=cs.filter(c=>c.status==='today');
  else if(TF==='tomorrow')cs=cs.filter(c=>c.status==='tomorrow');
  else if(TF==='active')cs=cs.filter(c=>!['done','none'].includes(c.status));

  el.innerHTML=`
    ${BF?`<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px">
      <span style="font-size:12px;color:var(--ac)">${BF}</span>
      <button class="btn bg" style="font-size:10px" onclick="BF=null;render()">← Todos</button>
    </div>`:''}
    <div class="frow">
      <span class="filter-label">Filtrar:</span>
      ${['active','overdue','today','tomorrow','all'].map(f=>`<button class="fb ${TF===f?'on':''}" onclick="TF='${f}';rTrello(document.getElementById('main'))">${{active:'Ativos',overdue:'Vencidos',today:'Hoje',tomorrow:'Amanhã',all:'Todos'}[f]}</button>`).join('')}
    </div>
    ${cs.length?`<div class="tw"><table>
      <thead><tr><th>Tarefa</th><th>Board</th><th>Lista</th><th>Prazo</th><th>Status</th></tr></thead>
      <tbody>${cs.map(c=>`<tr class="${c.status==='today'?'row-today':c.status==='overdue'?'row-overdue':''}">
        <td style="color:var(--t);max-width:260px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${c.url?`<a href="${c.url}" target="_blank" style="color:inherit;text-decoration:none">${c.name}</a>`:c.name}</td>
        <td><span style="display:inline-flex;align-items:center;gap:4px"><span class="dot" style="background:${bc(c.board)}"></span><span style="font-size:10px;color:var(--t3)">${sn(c.board)}</span></span></td>
        <td style="color:var(--t3);font-size:10px">${c.list}</td>
        <td>${dbadge(c.status)}<span style="font-size:10px;color:var(--t3);margin-left:4px">${fd(c.due)}</span></td>
        <td>${dbadge(c.status)}</td>
      </tr>`).join('')}</tbody>
    </table></div>`:'<div class="empty"><h3>Nenhum card</h3></div>'}`;
}

// ── NOTION — ordenado por data ──
function rNotion(el){
  const sorted=getSortedNotion(NTF);

  // Agrupar por urgência para mostrar separadores
  const groups=[
    {key:'overdue',label:'Vencido — publicar urgente',items:sorted.filter(n=>nurgency(n.due)==='overdue')},
    {key:'today',label:`Hoje — ${fd(today())}`,items:sorted.filter(n=>nurgency(n.due)==='today')},
    {key:'tomorrow',label:`Amanhã — ${fd(tomorrow())}`,items:sorted.filter(n=>nurgency(n.due)==='tomorrow')},
    {key:'soon',label:'Próximos dias',items:sorted.filter(n=>nurgency(n.due)==='soon')},
    {key:'none',label:'Sem data definida',items:sorted.filter(n=>nurgency(n.due)==='none')},
  ].filter(g=>g.items.length>0);

  el.innerHTML=`
    ${NF?`<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px">
      <span style="font-size:12px;color:var(--pu)">${NF}</span>
      <button class="btn bg" style="font-size:10px" onclick="NF=null;rNotion(document.getElementById('main'))">← Todas marcas</button>
    </div>`:''}
    <div class="frow">
      <span class="filter-label">Ver:</span>
      ${[
        {k:'date',l:'Por data'},
        {k:'today',l:'Hoje'},
        {k:'soon',l:'Esta semana'},
        {k:'ready',l:'Aprovados'},
        {k:'prod',l:'Em produção'},
        {k:'all',l:'Todos'},
      ].map(f=>`<button class="fb ${NTF===f.k?'on':''}" onclick="NTF='${f.k}';rNotion(document.getElementById('main'))">${f.l}</button>`).join('')}
    </div>
    ${groups.length?`<div class="tw">
      ${groups.map(g=>`
        <div class="date-sep">${g.label} <span style="font-size:9px;opacity:0.6">${g.items.length} item${g.items.length>1?'s':''}</span></div>
        <table><tbody>${g.items.map(n=>`<tr>
          <td style="color:var(--t);max-width:260px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${n.url?`<a href="${n.url}" target="_blank" style="color:inherit;text-decoration:none">${n.name}</a>`:n.name}</td>
          <td>${mbadge(n.marca)}</td>
          <td style="color:var(--t2);font-size:10px">${n.canal||'—'}</td>
          <td style="color:var(--t2);font-size:10px">${n.formato||'—'}</td>
          <td>${datePill(n.due)}</td>
          <td>${sbadge(n.status)}</td>
        </tr>`).join('')}</tbody></table>`).join('')}
    </div>`:'<div class="empty"><h3>Nenhum conteúdo</h3></div>'}`;
}

// ── BRIEFING ──
function getKey(){return(document.getElementById('ak')?.value||localStorage.getItem('k')||'').trim()}

function rBriefing(el){
  const k=localStorage.getItem('k')||'';
  el.innerHTML=`<div class="brw">
    <div class="brk">
      <div style="flex:1">
        <div class="lbl">Anthropic API Key</div>
        <input class="ainput" id="akb" type="password" placeholder="sk-ant-api03-..." value="${k}" oninput="localStorage.setItem('k',this.value);document.getElementById('ak').value=this.value" style="width:100%">
      </div>
      <div style="display:flex;gap:6px;flex-shrink:0;align-items:flex-end">
        <button class="btn bp" onclick="gen('morning')">Abertura</button>
        <button class="btn bg" onclick="gen('evening')">Fechamento</button>
      </div>
    </div>
    <div id="bo">
      <div class="empty" style="background:var(--s);border:1px solid var(--b);border-radius:var(--rl)">
        <h3>Nenhum briefing gerado</h3>
        <p style="margin-top:3px">Trello + Notion carregados. Cole a key e clique.</p>
      </div>
    </div>
  </div>`;
}

function buildCtx(){
  const st=stats();const t=today();
  let lines=[`Data: ${t}`,`Trello: ${st.ov} vencidos · ${st.td} hoje · ${st.tm} amanhã`,`Notion: ${st.np} em produção · ${st.na} aprovados`,``];
  for(const b of BOARDS){
    lines.push(`## TRELLO: ${b.name}`);
    for(const c of b.cards){const s=cls(c.due,c.dueComplete);if(s==='done')continue;lines.push(`- [${c.list}] ${c.name} | ${c.due||'sem prazo'} | ${s}`);}
    lines.push('');
  }
  lines.push('## NOTION (ordenado por publicação):');
  const sorted=getSortedNotion('date');
  for(const n of sorted){lines.push(`- ${n.name} | ${n.marca} | ${n.canal} | ${n.status} | pub: ${n.due||'sem data'}`);}
  return lines.join('\n');
}

async function gen(type){
  if(GEN)return;
  const k=getKey();
  if(!k||!k.startsWith('sk-')){toast('Cole a API Key primeiro.');return;}
  GEN=true;V='briefing';
  const bm=document.getElementById('bm'),be=document.getElementById('be');
  const btn=type==='morning'?bm:be;
  if(btn){btn.disabled=true;btn.innerHTML='<div class="spin"></div>';}
  rBriefing(document.getElementById('main'));
  const lbl=type==='morning'?'Abertura':'Fechamento';
  const cls2=type==='morning'?'bm':'be2';
  const ctx=buildCtx();const t=today();
  const sys=`Assistente estratégico de marketing do Grupo DNX (Pablo Guterres). 4 frentes: Desconexo, DNX Hotelaria, Desco, Marca Pablo. Briefings diários diretos, markdown simples, máx 400 palavras.`;
  const usr=type==='morning'
    ?`ABERTURA — ${t}\n\n${ctx}\n\n## Bom dia, time.\n## Atenção imediata\n(vencidos Trello)\n## Foco do dia\n(prioridades Trello + Notion publicando hoje/amanhã)\n## Conteúdo em pauta\n(Notion ordenado por urgência de publicação)\n## Esta semana\n## Lembrança estratégica`
    :`FECHAMENTO — ${t}\n\n${ctx}\n\n## Fechamento do dia.\n## Entregue hoje\n## Conteúdo publicado/pendente\n(Notion — o que saiu, o que ficou)\n## Pendente amanhã\n## Amanhã começa com`;
  const bo=document.getElementById('bo');
  if(bo)bo.innerHTML=`<div class="brbox"><div class="brtop"><div style="display:flex;align-items:center;gap:8px"><span class="badge ${cls2}">${lbl}</span><span style="font-size:10px;color:var(--t3)">${t}</span></div><button class="btn bg" style="font-size:10px" onclick="copyB()">Copiar</button></div><div class="brbody" id="bt"><span class="cur"></span></div></div>`;
  const txt=document.getElementById('bt');let full='';
  try{
    const r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'Content-Type':'application/json','x-api-key':k,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},body:JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:1000,stream:true,system:sys,messages:[{role:'user',content:usr}]})});
    if(!r.ok){const e=await r.json();throw new Error(e.error?.message||r.status);}
    const rd=r.body.getReader();const dc=new TextDecoder();
    while(true){
      const{done,value}=await rd.read();if(done)break;
      for(const ln of dc.decode(value,{stream:true}).split('\n')){
        if(ln.startsWith('data: ')&&ln!=='data: [DONE]'){
          try{const j=JSON.parse(ln.slice(6));if(j.delta?.text){full+=j.delta.text;if(txt){txt.innerHTML=mdp(full)+'<span class="cur"></span>';txt.scrollTop=txt.scrollHeight;}}}catch(e){}
        }
      }
    }
    LB=full;if(txt)txt.innerHTML=mdp(full);
  }catch(e){if(txt)txt.innerHTML=`<p style="color:var(--red)">Erro: ${e.message}</p>`;}
  finally{GEN=false;if(bm){bm.disabled=false;bm.textContent='Abertura';}if(be){be.disabled=false;be.textContent='Fechamento';}}
}

function mdp(t){
  return t
    .replace(/^## (.+)$/gm,'<h2>$1</h2>')
    .replace(/^### (.+)$/gm,'<h3 style="font-size:12px;color:var(--t2);margin:10px 0 4px">$1</h3>')
    .replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>')
    .replace(/^- (.+)$/gm,'<li>$1</li>')
    .replace(/(<li>.*?<\/li>\n?)+/gs,m=>`<ul>${m}</ul>`)
    .replace(/\n\n+/g,'</p><p>')
    .trim();
}
function copyB(){if(!LB){toast('Gere um briefing primeiro.');return;}navigator.clipboard.writeText(LB).then(()=>toast('Copiado!'))}

function init(){
  const d=new Date();
  document.getElementById('td').textContent=d.toLocaleDateString('pt-BR',{weekday:'long',day:'numeric',month:'long'});
  const k=localStorage.getItem('k')||'';
  if(k)document.getElementById('ak').value=k;
  render();
}
init();
</script>
</body>
</html>
